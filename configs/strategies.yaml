strategies:
  - id: coalesced_global_memory
    description: Improve global-memory access coalescing
    prompts:
      cuda_cpp: |
        Rewrite the kernel to improve global-memory coalescing while preserving exact workload semantics.
  - id: vectorized_memory_access
    description: Use safe vectorized memory operations
    prompts:
      cuda_cpp: |
        Apply aligned vectorized loads or stores where permitted by the workload contract.
  - id: reduce_synchronization
    description: Eliminate unnecessary synchronization
    prompts:
      cuda_cpp: |
        Reduce synchronization overhead without introducing races or changing numerical semantics.
  - id: reduce_register_pressure
    description: Reduce register pressure
    prompts:
      cuda_cpp: |
        Reduce register pressure while preserving correctness and useful instruction-level parallelism.
  - id: specialize_workload_shape
    description: Specialize for the fixed workload shapes
    prompts:
      cuda_cpp: |
        Specialize the implementation for the allowed workload shapes and launch choices.
  - id: tensor_core_output_tiling
    description: Assign independent tensor-core output tiles to warps
    prompts:
      cuda_cpp: |
        Redesign the BF16 GEMM around tensor-core MMA so each warp owns and accumulates
        a distinct output tile instead of splitting K across warps and reducing partial
        results through shared memory. Preserve the fixed ABI and launch configuration.
        If a block must cover a larger output region, safely group the fixed logical
        block coordinates, make non-owner blocks return, and ensure every output is
        written exactly once. Keep FP32 accumulation and the declared A, B, and C
        layouts. Use the parent profile to improve tensor-pipe utilization.
  - id: pipeline_tensor_core_data_movement
    description: Pipeline tensor-core operands through shared memory
    prompts:
      cuda_cpp: |
        Build a tiled BF16 tensor-core GEMM whose warps compute independent output
        tiles, and overlap global-memory movement with MMA work using safe staged or
        asynchronous copies where supported. Use coalesced and vectorized accesses,
        shared-memory layouts that avoid bank conflicts, and FP32 accumulators.
        Preserve the fixed ABI, launch configuration, tensor layouts, and exact output
        coverage. Do not introduce a cross-warp reduction of partial K accumulations.
  - id: tensor_core_multi_accumulator
    description: Increase tensor-core work per warp and operand-loading stage
    prompts:
      cuda_cpp: |
        Redesign the BF16 tensor-core GEMM so each warp owns multiple independent
        accumulator fragments and performs several MMA operations for every staged A
        and B operand tile. Increase useful arithmetic per synchronization and
        data-movement stage by reusing staged operands across a larger warp-level
        output tile. Preserve FP32 accumulation, exact output ownership, the fixed ABI,
        launch configuration, and tensor layouts. Safely group logical block
        coordinates if a physical block covers a larger output region. Balance the
        number of accumulator fragments against register pressure and occupancy, stay
        within shared-memory limits, and retain effective double buffering or
        asynchronous copies. Do not split K across warps or reduce partial
        accumulations through shared memory.
